version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: wa-tech-assignment
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/app
    command: npm run dev
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: wa-tech-assignment-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  redis-data:
